<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazing Songs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Amazing Songs</h1>
        <p>Embed Spotify tracks, albums, playlists</p>
      </header>

      <section class="input-section">
        <label for="spotifyUrl">Paste a Spotify link or URI:</label>
        <div class="input-row">
          <input id="spotifyUrl" type="text" placeholder="https://open.spotify.com/track/..." />
          <button id="addBtn">Add</button>
          <button id="clearBtn" class="danger">Clear</button>
        </div>
        <p class="hint">Tip: In Spotify click ••• → Share → Copy Song Link.</p>
      </section>

      <section id="embedsContainer" class="embeds"></section>

      <footer>
        <p>Built with ❤️ — paste Spotify links to embed songs.</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
