<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Editor - Cubes & Reference Images | Transform, Undo/Redo, Import/Export</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* UI Panel - Modern Glassmorphism */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 10;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 14px;
        }
        .ui-panel button, .ui-panel select {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            font-size: 13px;
        }
        .ui-panel button:hover {
            background: #1e2a4a;
            transform: scale(1.02);
        }
        .ui-panel button.danger {
            background: #a13e3e;
        }
        .ui-panel button.danger:hover {
            background: #7a2e2e;
        }
        .ui-panel .separator {
            width: 1px;
            background: rgba(255,255,255,0.3);
            margin: 0 5px;
        }
        .mode-badge {
            background: #000000aa;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 5px;
        }
        .info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            color: #ccc;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }
        @media (max-width: 800px) {
            .ui-panel { font-size: 11px; padding: 8px 12px; gap: 6px; }
            .ui-panel button { padding: 4px 8px; font-size: 11px; }
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            background: #2c3e66;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <button id="btnAddCube">➕ Add Cube</button>
        <button id="btnAddImage">🖼️ Add Reference Image</button>
        <div class="separator"></div>
        <button id="btnDelete">🗑️ Delete Selected</button>
        <button id="btnUndo">↩️ Undo</button>
        <button id="btnRedo">↪️ Redo</button>
        <button id="btnCopy">📋 Copy</button>
        <button id="btnPaste">📎 Paste</button>
        <div class="separator"></div>
        <button id="btnExportJSON">📄 Export JSON</button>
        <button id="btnExportOBJ">🔺 Export OBJ</button>
        <label class="file-label" for="importJsonFile">📂 Import JSON</label>
        <input type="file" id="importJsonFile" accept=".json">
        <label class="file-label" for="importObjFile">📂 Import OBJ</label>
        <input type="file" id="importObjFile" accept=".obj">
        <div class="mode-badge" id="transformModeDisplay">📍 Transform: Translate</div>
        <select id="transformSelect">
            <option value="translate">Move (XYZ)</option>
            <option value="rotate">Rotate (XYZ)</option>
            <option value="scale">Scale (XYZ)</option>
        </select>
    </div>
    <div class="info">
        🖱️ Select object | 🎮 Gizmo for X/Y/Z transforms | 📷 Reference Image = Billboard sprite
    </div>

    <!-- Import Three.js core and add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // --- Setup Scene, Camera, Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.FogExp2(0x111122, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 6, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // shadows for cubes
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Controls & Helpers ---
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.05;
        orbitControls.screenSpacePanning = true; // avoid panning tilt

        // TransformControls for selected object
        let transformControls = new TransformControls(camera, renderer.domElement);
        transformControls.addEventListener('dragging-changed', (event) => {
            // Disable orbit while dragging transform gizmo
            orbitControls.enabled = !event.value;
        });
        scene.add(transformControls);

        // --- Global State ---
        let objects = [];        // array of all editable objects (Mesh for cubes, Sprite for images)
        let selectedObject = null;
        
        // History state (undo/redo)
        let historyStack = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;

        // Copy/Paste buffer (stores serialized object data)
        let copyBuffer = null;

        // Helper: save current scene state (deep copy of objects transforms and type)
        function captureState() {
            return objects.map(obj => ({
                uuid: obj.uuid,
                type: obj.userData.isReferenceImage ? 'image' : 'cube',
                position: obj.position.clone(),
                scale: obj.scale.clone(),
                rotation: obj.rotation.clone(), // Euler for cubes; for sprites rotation.z only but we store full
                imageUrl: obj.userData.imageUrl || null,
                color: obj.material?.color?.getHex() || null
            }));
        }

        function pushHistory() {
            const state = captureState();
            // Trim future if we are in the middle of undo chain
            if (historyIndex < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyIndex + 1);
            }
            historyStack.push(state);
            if (historyStack.length > MAX_HISTORY) historyStack.shift();
            else historyIndex = historyStack.length - 1;
        }

        function restoreState(state) {
            // Clear current objects from scene
            objects.forEach(obj => {
                if (obj.parent) scene.remove(obj);
                if (obj.isSprite) obj.material.map?.dispose();
                if (obj.isMesh) obj.geometry.dispose();
            });
            objects = [];
            selectedObject = null;
            transformControls.detach();

            // Rebuild from state
            for (let data of state) {
                if (data.type === 'cube') {
                    createCubeFromData(data);
                } else if (data.type === 'image') {
                    createImageFromData(data);
                }
            }
            // Re-attach transform if previously selected object exists in new list
            if (selectedObject && objects.find(o => o.uuid === selectedObject.uuid)) {
                transformControls.attach(selectedObject);
            } else {
                selectedObject = null;
            }
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreState(historyStack[historyIndex]);
            }
        }
        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                restoreState(historyStack[historyIndex]);
            }
        }

        // Record a snapshot before any modification
        function recordSnapshot() {
            pushHistory();
        }

        // --- Cube Creation ---
        function createCube(color = 0x4c9aff, pos = null) {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 });
            const cube = new THREE.Mesh(geometry, material);
            cube.castShadow = true;
            cube.receiveShadow = true;
            cube.userData = { isReferenceImage: false, type: 'cube' };
            if (pos) cube.position.copy(pos);
            else cube.position.set(0, 0.5, 0);
            cube.name = `Cube_${Date.now()}_${Math.floor(Math.random()*1000)}`;
            scene.add(cube);
            return cube;
        }
        
        function createCubeFromData(data) {
            const cube = createCube(data.color || 0x4c9aff);
            cube.position.copy(data.position);
            cube.scale.copy(data.scale);
            cube.rotation.copy(data.rotation);
            cube.userData.uuidBackup = data.uuid;
            cube.uuid = data.uuid; // maintain same uuid for selection consistency
            objects.push(cube);
            return cube;
        }

        // --- Reference Image (Sprite with always facing camera) ---
        function createReferenceImage(imageUrl, pos = null) {
            // Load image texture
            const texture = new THREE.TextureLoader().load(imageUrl, undefined, undefined, (err) => console.warn("Image load error", err));
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: true, depthWrite: false });
            const sprite = new THREE.Sprite(material);
            sprite.userData = { isReferenceImage: true, imageUrl: imageUrl, type: 'image' };
            // Default size: maintain aspect? we'll set scale to 2x2 relative to texture aspect
            // For simplicity, default scale (2,2,1) and keep it.
            if (pos) sprite.position.copy(pos);
            else sprite.position.set(0, 1.5, 0);
            sprite.scale.set(2, 2, 1);
            sprite.name = `RefImage_${Date.now()}`;
            scene.add(sprite);
            return sprite;
        }

        function createImageFromData(data) {
            if (!data.imageUrl) return null;
            const texture = new THREE.TextureLoader().load(data.imageUrl);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.copy(data.position);
            sprite.scale.copy(data.scale);
            // rotation for sprite: only z rotation matters; store euler as x,y,z but sprite uses rotation.z
            if (data.rotation) sprite.rotation.z = data.rotation.z;
            else sprite.rotation.z = 0;
            sprite.userData = { isReferenceImage: true, imageUrl: data.imageUrl, type: 'image' };
            sprite.uuid = data.uuid;
            objects.push(sprite);
            scene.add(sprite);
            return sprite;
        }

        // Add cube with history
        function addCube() {
            recordSnapshot();
            const cube = createCube();
            objects.push(cube);
            selectObject(cube);
        }

        // Add reference image via file picker
        function addReferenceImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/jpeg, image/png, image/jpg, image/gif, image/webp';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const url = URL.createObjectURL(file);
                recordSnapshot();
                const sprite = createReferenceImage(url);
                // store original blob URL to later export as base64? For JSON export we store relative url or dataURL
                // But for simplicity store the objectURL; but note: internal userData stores URL string.
                // When exporting JSON, we convert image data to base64 to be self-contained.
                // For now we keep blob URL for runtime.
                sprite.userData.imageUrl = url; // store blob URL for runtime, but for JSON we'll convert on export
                objects.push(sprite);
                selectObject(sprite);
                // free temp input
                input.remove();
            };
            input.click();
        }

        function deleteSelected() {
            if (!selectedObject) return;
            recordSnapshot();
            const idx = objects.findIndex(obj => obj.uuid === selectedObject.uuid);
            if (idx !== -1) {
                scene.remove(selectedObject);
                objects.splice(idx, 1);
                // dispose geometries/textures to avoid memory leaks
                if (selectedObject.isMesh) {
                    selectedObject.geometry.dispose();
                    selectedObject.material.dispose();
                }
                if (selectedObject.isSprite) {
                    selectedObject.material.map?.dispose();
                    selectedObject.material.dispose();
                }
                transformControls.detach();
                selectedObject = null;
            }
        }

        function selectObject(obj) {
            if (selectedObject === obj) return;
            selectedObject = obj;
            transformControls.detach();
            if (obj) {
                transformControls.attach(obj);
                // Ensure transform mode matches current dropdown
                const mode = document.getElementById('transformSelect').value;
                transformControls.setMode(mode);
            }
        }

        // Copy: serialize selected object fully
        function copySelected() {
            if (!selectedObject) return;
            const data = {
                type: selectedObject.userData.isReferenceImage ? 'image' : 'cube',
                position: selectedObject.position.clone(),
                scale: selectedObject.scale.clone(),
                rotation: selectedObject.rotation.clone(),
                color: selectedObject.isMesh ? selectedObject.material.color.getHex() : null,
                imageUrl: selectedObject.userData.imageUrl || null
            };
            // for images, we attempt to capture base64 if imageUrl is blob or external
            if (data.type === 'image' && data.imageUrl) {
                // if imageUrl starts with blob: we need to convert to base64 for robust copy/paste across sessions
                // We'll fetch image and convert
                fetch(data.imageUrl).then(res => res.blob()).then(blob => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        data.imageUrl = reader.result; // base64
                        copyBuffer = data;
                    };
                    reader.readAsDataURL(blob);
                }).catch(() => { copyBuffer = data; });
            } else {
                copyBuffer = data;
            }
            if (data.type !== 'image') copyBuffer = data;
        }

        function pasteObject() {
            if (!copyBuffer) return;
            recordSnapshot();
            let newObj;
            if (copyBuffer.type === 'cube') {
                newObj = createCube(copyBuffer.color || 0x4c9aff);
                newObj.position.copy(copyBuffer.position);
                newObj.scale.copy(copyBuffer.scale);
                newObj.rotation.copy(copyBuffer.rotation);
                // offset slightly to avoid overlap
                newObj.position.x += 0.8;
                newObj.position.z += 0.8;
            } else if (copyBuffer.type === 'image') {
                if (!copyBuffer.imageUrl) return;
                let imgUrl = copyBuffer.imageUrl;
                // if base64 data, use directly
                const texture = new THREE.TextureLoader().load(imgUrl);
                const material = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(material);
                sprite.position.copy(copyBuffer.position);
                sprite.scale.copy(copyBuffer.scale);
                sprite.rotation.z = copyBuffer.rotation.z;
                sprite.userData = { isReferenceImage: true, imageUrl: imgUrl, type: 'image' };
                sprite.position.x += 0.8;
                sprite.position.z += 0.8;
                newObj = sprite;
                scene.add(newObj);
            }
            if (newObj) {
                objects.push(newObj);
                selectObject(newObj);
            }
        }

        // --- Export / Import Logic ---
        async function exportToJSON() {
            const exportData = [];
            for (let obj of objects) {
                let item = {
                    type: obj.userData.isReferenceImage ? 'image' : 'cube',
                    position: { x: obj.position.x, y: obj.position.y, z: obj.position.z },
                    scale: { x: obj.scale.x, y: obj.scale.y, z: obj.scale.z },
                    rotation: { x: obj.rotation.x, y: obj.rotation.y, z: obj.rotation.z }
                };
                if (item.type === 'cube') {
                    item.color = obj.material.color.getHex();
                } else {
                    // For images, embed image as base64 if possible
                    let imgUrl = obj.userData.imageUrl;
                    if (imgUrl && (imgUrl.startsWith('blob:') || imgUrl.startsWith('http://') || imgUrl.startsWith('https://'))) {
                        // fetch and convert to base64
                        try {
                            const response = await fetch(imgUrl);
                            const blob = await response.blob();
                            const base64 = await new Promise((res) => {
                                const reader = new FileReader();
                                reader.onloadend = () => res(reader.result);
                                reader.readAsDataURL(blob);
                            });
                            item.imageData = base64;
                        } catch(e) {
                            item.imageUrl = imgUrl; // fallback keep original url
                        }
                    } else {
                        item.imageData = imgUrl; // might already be base64 or null
                    }
                }
                exportData.push(item);
            }
            const jsonStr = JSON.stringify(exportData, null, 2);
            downloadFile(jsonStr, 'scene.json', 'application/json');
        }

        async function importFromJSON(file) {
            const text = await file.text();
            const data = JSON.parse(text);
            recordSnapshot();
            // clear current scene
            for (let obj of objects) {
                scene.remove(obj);
                if (obj.isMesh) { obj.geometry.dispose(); obj.material.dispose(); }
                if (obj.isSprite) { obj.material.map?.dispose(); obj.material.dispose(); }
            }
            objects = [];
            selectedObject = null;
            transformControls.detach();
            
            for (let item of data) {
                if (item.type === 'cube') {
                    const cube = createCube(item.color || 0x4c9aff);
                    cube.position.set(item.position.x, item.position.y, item.position.z);
                    cube.scale.set(item.scale.x, item.scale.y, item.scale.z);
                    cube.rotation.set(item.rotation.x, item.rotation.y, item.rotation.z);
                    objects.push(cube);
                } else if (item.type === 'image') {
                    let imageSource = item.imageData || item.imageUrl;
                    if (!imageSource) continue;
                    const texture = new THREE.TextureLoader().load(imageSource);
                    const material = new THREE.SpriteMaterial({ map: texture });
                    const sprite = new THREE.Sprite(material);
                    sprite.position.set(item.position.x, item.position.y, item.position.z);
                    sprite.scale.set(item.scale.x, item.scale.y, item.scale.z);
                    sprite.rotation.z = item.rotation.z;
                    sprite.userData = { isReferenceImage: true, imageUrl: imageSource, type: 'image' };
                    scene.add(sprite);
                    objects.push(sprite);
                }
            }
            // push clean history state after import
            pushHistory();
        }

        // OBJ export (only cube meshes, ignores sprites/images because OBJ doesn't support billboards)
        function exportToOBJ() {
            let objContent = "# 3D Editor Export\n";
            let vertexOffset = 1;
            for (let obj of objects) {
                if (obj.userData.isReferenceImage) continue; // skip sprites in OBJ
                if (!obj.isMesh) continue;
                // extract world transform? For simplicity use local matrix relative to scene, but export scaled cube geometry?
                // We'll approximate: write vertices of a unit cube transformed by object's matrix
                const matrix = obj.matrixWorld;
                const halfSize = 0.5;
                const localVerts = [
                    new THREE.Vector3(-halfSize, -halfSize,  halfSize), // 0
                    new THREE.Vector3( halfSize, -halfSize,  halfSize), // 1
                    new THREE.Vector3( halfSize,  halfSize,  halfSize), // 2
                    new THREE.Vector3(-halfSize,  halfSize,  halfSize), // 3
                    new THREE.Vector3(-halfSize, -halfSize, -halfSize), // 4
                    new THREE.Vector3( halfSize, -halfSize, -halfSize), // 5
                    new THREE.Vector3( halfSize,  halfSize, -halfSize), // 6
                    new THREE.Vector3(-halfSize,  halfSize, -halfSize)  // 7
                ];
                const worldVerts = localVerts.map(v => v.clone().applyMatrix4(matrix));
                const indices = [
                    0,1,2, 0,2,3, // front
                    4,6,5, 4,7,6, // back
                    0,3,7, 0,7,4, // left
                    1,5,6, 1,6,2, // right
                    3,2,6, 3,6,7, // top
                    0,4,5, 0,5,1  // bottom
                ];
                const baseIdx = vertexOffset;
                worldVerts.forEach(v => {
                    objContent += `v ${v.x} ${v.y} ${v.z}\n`;
                });
                for (let i = 0; i < indices.length; i += 3) {
                    objContent += `f ${baseIdx+indices[i]} ${baseIdx+indices[i+1]} ${baseIdx+indices[i+2]}\n`;
                }
                vertexOffset += 8;
            }
            downloadFile(objContent, 'scene.obj', 'text/plain');
        }

        function downloadFile(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // Import OBJ (only supports cubes as simple meshes - we interpret each mesh group as a cube)
        function importOBJ(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                const lines = content.split('\n');
                const vertices = [];
                const faceGroups = [];
                // parse vertices and faces (just triangulated). We'll create one cube per "object"? Actually we'll make a single mesh of whole? Simpler: create a single mesh default?
                // Better: group distinct meshes by object flag, but robust: we'll create one cube from the bounding box of vertices.
                // To keep user friendly: create ONE standard cube based on parsed vertices average position and scale.
                // But spec requires import obj - we'll reconstruct cube-like object from average center and extents.
                let positions = [];
                for (let line of lines) {
                    if (line.startsWith('v ')) {
                        const parts = line.trim().split(/\s+/);
                        if (parts.length >= 4) {
                            const x = parseFloat(parts[1]);
                            const y = parseFloat(parts[2]);
                            const z = parseFloat(parts[3]);
                            positions.push(new THREE.Vector3(x, y, z));
                        }
                    }
                }
                if (positions.length === 0) return;
                // compute bounding box
                const min = new THREE.Vector3(Infinity, Infinity, Infinity);
                const max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
                positions.forEach(p => {
                    min.x = Math.min(min.x, p.x);
                    min.y = Math.min(min.y, p.y);
                    min.z = Math.min(min.z, p.z);
                    max.x = Math.max(max.x, p.x);
                    max.y = Math.max(max.y, p.y);
                    max.z = Math.max(max.z, p.z);
                });
                const center = min.clone().add(max).multiplyScalar(0.5);
                const size = max.clone().sub(min);
                const scale = new THREE.Vector3(size.x, size.y, size.z);
                recordSnapshot();
                const cube = createCube(0x66cc88);
                cube.position.copy(center);
                cube.scale.copy(scale);
                objects.push(cube);
                selectObject(cube);
                pushHistory();
            };
            reader.readAsText(file);
        }

        // --- UI Event Binding & Transform Mode Sync ---
        document.getElementById('btnAddCube').addEventListener('click', () => addCube());
        document.getElementById('btnAddImage').addEventListener('click', () => addReferenceImage());
        document.getElementById('btnDelete').addEventListener('click', () => deleteSelected());
        document.getElementById('btnUndo').addEventListener('click', () => undo());
        document.getElementById('btnRedo').addEventListener('click', () => redo());
        document.getElementById('btnCopy').addEventListener('click', () => copySelected());
        document.getElementById('btnPaste').addEventListener('click', () => pasteObject());
        document.getElementById('btnExportJSON').addEventListener('click', () => exportToJSON());
        document.getElementById('btnExportOBJ').addEventListener('click', () => exportToOBJ());
        document.getElementById('importJsonFile').addEventListener('change', (e) => {
            if (e.target.files[0]) importFromJSON(e.target.files[0]);
            e.target.value = '';
        });
        document.getElementById('importObjFile').addEventListener('change', (e) => {
            if (e.target.files[0]) importOBJ(e.target.files[0]);
            e.target.value = '';
        });
        const transformSelect = document.getElementById('transformSelect');
        transformSelect.addEventListener('change', (e) => {
            if (transformControls && selectedObject) {
                transformControls.setMode(e.target.value);
            }
        });
        // click on object for selection using raycasting
        const raycaster = new THREE.Raycaster();
        renderer.domElement.addEventListener('click', (event) => {
            // ignore if clicking on UI panel
            if (event.target.closest('.ui-panel')) return;
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);
            if (intersects.length > 0) {
                const picked = intersects[0].object;
                selectObject(picked);
            } else {
                // optional: deselect? we keep selection but we could deselect: transformControls.detach(); selectedObject=null;
                // usually better keep selected
            }
        });
        
        // Initial scene setup: add a ground grid and light
        const gridHelper = new THREE.GridHelper(20, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 5, 2);
        dirLight.castShadow = true;
        dirLight.receiveShadow = false;
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.4);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        
        // Add demo cube and image for preview
        recordSnapshot(); // initial state
        const demoCube = createCube(0x5a9eff);
        demoCube.position.set(1, 0.5, -1);
        objects.push(demoCube);
        // demo image placeholder (checker texture fallback? use placeholder image)
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffaa88';
        ctx.fillRect(0,0,512,512);
        ctx.fillStyle = '#aa44ff';
        ctx.font = 'bold 40px sans-serif';
        ctx.fillText("Ref", 200, 270);
        const placeholderURL = canvas.toDataURL();
        const demoImage = createReferenceImage(placeholderURL);
        demoImage.position.set(-1.2, 1.2, -0.8);
        demoImage.scale.set(1.8, 1.8, 1);
        objects.push(demoImage);
        pushHistory(); // capture starting state
        
        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update(); // update if enabled
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        console.log("3D Editor ready");
    </script>
</body>
</html>
